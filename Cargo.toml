[package]
name = "planetmap"
version = "0.1.0"
authors = ["Benjamin Saunders <ben.e.saunders@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.100"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
parry = ["dep:parry3d-f64", "dep:lru-slab"]
fearless_simd = ["dep:fearless_simd"]

[dependencies]
na = { package = "nalgebra", version = "0.35.0" }
slab = "0.4.2"
hashbrown = "0.17"
parry3d-f64 = { version = "0.31.1", optional = true }
lru-slab = { version = "0.1.1", optional = true }
fearless_simd = { version = "1.1.0", optional = true }

[dev-dependencies]
criterion = "0.8.0"
approx = "0.5"
fearless_simd = { version = "1.1", features = ["force_support_fallback"] }

[[bench]]
name = "bench"
harness = false

[package.metadata.rust-skills2]
allow-test-panics = true
allow-test-panics-reason = "Existing geometric property and integration tests use unwrap and panic assertions; production and examples remain strict"
