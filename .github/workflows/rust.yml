name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@834173ae06c35bfc435c68db85aa8a8eeda09c23 # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust 1.100.0 all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@6d34275dcd0018efd209389b95d83a3dc9b52ba1 # main
    with:
      rust-toolchain: "1.100.0"
      command: cargo +1.100.0 test --locked --workspace --all-targets --all-features
