name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@4f29271a2aa27bef1f34bd70407b0db3d39904a9 # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust pinned nightly all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      command: cargo +nightly-2026-11-19 test --locked --workspace --all-targets --all-features

  miri:
    name: Cubemap allocation and borrowing under Miri
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      rust-components: "miri rust-src"
      rustflags: ""
      command: cargo +nightly-2026-11-19 miri test --locked --lib --no-default-features cubemap::test::memory_
