name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@c9dbc011bec3c43a65b62a16cbf2a3f2e31a13cb # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust 1.100.0 all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@d168449633a47de6c0166f0c0cff903e96983820 # main
    with:
      rust-toolchain: "1.100.0"
      command: cargo +1.100.0 test --locked --workspace --all-targets --all-features
