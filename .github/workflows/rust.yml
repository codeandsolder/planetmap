name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@23937d404c2556ec3ef7dd8eef345623fa97a099 # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust pinned nightly all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      command: cargo +nightly-2026-11-19 test --locked --workspace --all-targets --all-features

  miri:
    name: Cubemap allocation and borrowing under Miri
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@8ab6060d47a3c56bb406aff41189fbfcf7aa9acc # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      rust-components: "miri rust-src"
      rustflags: ""
      command: cargo +nightly-2026-11-19 miri test --locked --lib --no-default-features cubemap::test::memory_
