name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@82886ae85915af41ea90bf225bdffb3d9d359f69 # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust 1.99.1 all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@9190509a6314e35770f27b70dc771d14227e95aa # main
    with:
      rust-toolchain: "1.99.1"
      command: cargo +1.99.1 test --locked --workspace --all-targets --all-features
