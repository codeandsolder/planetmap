name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust pinned nightly all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@91183d106cd3b1f251fa52d9f3b78429af6f9e7c # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      command: cargo +nightly-2026-11-19 test --locked --workspace --all-targets --all-features

  miri:
    name: Cubemap allocation and borrowing under Miri
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@91183d106cd3b1f251fa52d9f3b78429af6f9e7c # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      rust-components: "miri rust-src"
      rustflags: ""
      command: cargo +nightly-2026-11-19 miri test --locked --lib --no-default-features cubemap::test::memory_
