name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-rust:
    name: Strict Rust and source policy
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@1732f9bf2e6edb7a983afc9bf175acbbe488f456 # main
    with:
      cargo-args: --locked --workspace --all-targets --all-features

  tests:
    name: Rust 1.99.1 all-feature tests
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@47aa3c1b587f9933f56310f82427ff86539b3ac9 # main
    with:
      rust-toolchain: "1.99.1"
      command: cargo +1.99.1 test --locked --workspace --all-targets --all-features
